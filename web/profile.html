<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Профиль — MyContractAnalyzer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/style.css">
<script src="/ui.js"></script>
</head>
<body class="min-h-screen">
<div class="orb orb-a"></div><div class="orb orb-b"></div>
<div id="siteNav"></div>

<main class="max-w-4xl mx-auto px-6 py-10 space-y-8 relative z-10">
  <h1 class="text-3xl font-bold">⚙️ Профиль и настройки</h1>

  <section class="glass p-6">
    <h2 class="font-bold mb-4">👤 Мои данные</h2>
    <div id="meBox" class="text-sm space-y-1"></div>
    <div class="flex flex-wrap gap-3 mt-5">
      <a href="/analyze.html" class="btn-primary text-sm">📄 Анализ договора</a>
      <a href="/lawyer.html" class="btn-ghost text-sm">🤖 ИИ-юрист 24/7</a>
    </div>
  </section>

  <section class="glass p-6">
    <h2 class="font-bold mb-4">🔑 Смена пароля</h2>
    <form id="passForm" class="grid md:grid-cols-3 gap-4">
      <input name="old" type="password" placeholder="Текущий пароль" class="input">
      <input name="new" type="password" placeholder="Новый пароль" minlength="6" class="input">
      <input name="new2" type="password" placeholder="Повторите новый" minlength="6" class="input">
      <button class="btn-primary md:col-span-3 text-sm">💾 Сменить пароль</button>
    </form>
    <div id="passMsg" class="mt-3 text-sm"></div>
  </section>

  <section class="glass p-6">
    <h2 class="font-bold mb-4">💬 Поддержка</h2>
    <p class="text-sm text-white/60 mb-4">Обращение попадёт администратору, ответ придёт на твой email.</p>
    <form id="supForm" class="space-y-4">
      <select name="topic" class="input">
        <option>Вопрос по анализу</option><option>Оплата и тарифы</option>
        <option>Техническая проблема</option><option>Предложение</option><option>Другое</option>
      </select>
      <textarea name="message" rows="4" placeholder="Опиши вопрос…" class="input"></textarea>
      <button class="btn-primary text-sm">📨 Отправить обращение</button>
    </form>
    <div id="supMsg" class="mt-3 text-sm"></div>
  </section>

  <section class="glass p-6">
    <h2 class="font-bold mb-3">📦 Старые инструменты</h2>
    <p class="text-sm text-white/60">Удаление аккаунта, история проверок, сравнение версий и прочие инструменты старой версии:</p>
    <a href="/old/" class="btn-ghost text-sm mt-3 inline-flex">Открыть старую версию</a>
  </section>
</main>

<div id="siteFooter"></div>

<script>
const token = mcaToken();
if (!token) location.href = '/auth.html#login';
fetch('/api/me', {headers: {'Authorization': 'Bearer ' + token}})
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(u => {
    document.getElementById('meBox').innerHTML =
      '<p><b>Email:</b> ' + mcaEsc(u.email) + '</p><p><b>Тариф:</b> ' + mcaEsc(u.tariff) +
      '</p><p><b>Проверок осталось:</b> ' + u.checks_left + '</p>';
  })
  .catch(() => location.href = '/auth.html#login');

document.getElementById('passForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('passMsg');
  const fd = new FormData(e.target);
  if (fd.get('new') !== fd.get('new2')) { msg.textContent = '❌ Новые пароли не совпадают'; msg.className = 'mt-3 text-sm text-red-400'; return; }
  const r = await fetch('/api/change_password', {method: 'POST',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
    body: JSON.stringify({old: fd.get('old'), new: fd.get('new')})});
  const d = await r.json();
  msg.textContent = r.ok ? '✅ ' + (d.message || 'Пароль изменён') : '❌ ' + (d.detail || 'Ошибка');
  msg.className = 'mt-3 text-sm ' + (r.ok ? 'text-green-400' : 'text-red-400');
});

document.getElementById('supForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('supMsg');
  const fd = new FormData(e.target);
  const r = await fetch('/api/support', {method: 'POST',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
    body: JSON.stringify({topic: fd.get('topic'), message: fd.get('message')})});
  msg.textContent = r.ok ? '✅ Обращение отправлено! Ответ придёт на email.' : '❌ Ошибка отправки';
  msg.className = 'mt-3 text-sm ' + (r.ok ? 'text-green-400' : 'text-red-400');
});
mcaNav(); mcaFooter();
</script>
</body>
</html>
