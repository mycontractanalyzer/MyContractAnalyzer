<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — MyContractAnalyzer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/style.css">
<script src="/ui.js"></script>
</head>
<body class="min-h-screen">
<div class="orb orb-a"></div><div class="orb orb-b"></div>
<div id="siteNav"></div>

<main class="max-w-6xl mx-auto px-6 py-10 relative z-10">
  <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
    <h1 class="text-3xl md:text-4xl font-extrabold grad-text">🛠 Админ-панель</h1>
    <button id="refreshBtn" class="btn-ghost text-sm">🔄 Обновить данные</button>
  </div>

  <div id="errBox" class="hidden mb-6 p-4 rounded-2xl bg-red-500/10 border border-red-500/40 text-sm text-red-300"></div>

  <div class="flex flex-wrap gap-2 mb-8 text-sm">
    <button data-tab="dash" class="tab-btn on">📊 Дашборд</button>
    <button data-tab="users" class="tab-btn">👥 Пользователи</button>
    <button data-tab="tariff" class="tab-btn">💳 Тариф</button>
    <button data-tab="checks" class="tab-btn">🎁 Проверки</button>
    <button data-tab="promos" class="tab-btn">🏷 Промокоды</button>
    <button data-tab="support" class="tab-btn">📩 Обращения</button>
    <button data-tab="feedback" class="tab-btn">⭐ Отзывы</button>
    <button data-tab="consults" class="tab-btn">🧑⚖️ Заявки</button>
    <button data-tab="laws" class="tab-btn">📚 Законы</button>
  </div>

  <div id="tab-dash" class="pane">
    <div id="statCards" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></div>
    <div class="grid lg:grid-cols-2 gap-6 mb-6">
      <div class="glass p-6"><h3 class="font-bold mb-4">Регистрации по дням</h3><div id="regsChart"></div></div>
      <div class="glass p-6"><h3 class="font-bold mb-4">Анализы по дням</h3><div id="anlsChart"></div></div>
    </div>
    <div class="glass p-6"><h3 class="font-bold mb-4">Топ промокодов</h3><div id="topPromos" class="text-sm space-y-2"></div></div>
  </div>

  <div id="tab-users" class="pane hidden">
    <div class="glass p-4 mb-4">
      <input id="userSearch" class="input" placeholder="🔍 Поиск по email или номеру…">
    </div>
    <div id="usersList" class="space-y-2"></div>
  </div>

  <div id="tab-tariff" class="pane hidden">
    <div class="glass p-6 max-w-xl">
      <label class="block mb-4 text-sm"><span class="text-white/70">Пользователь</span>
        <select id="tariffUser" class="input mt-2"></select></label>
      <label class="block mb-4 text-sm"><span class="text-white/70">Тариф (проверки начислятся по тарифу)</span>
        <select id="tariffSel" class="input mt-2">
          <option>Free</option><option>Light</option><option>Standard</option>
          <option>Pro</option><option>Business</option><option>Business Pro</option>
        </select></label>
      <label class="block mb-6 text-sm"><span class="text-white/70">Промокод скидки (если клиент оплатил с ним)</span>
        <input id="tariffPromo" class="input mt-2" placeholder="Необязательно"></label>
      <button id="tariffBtn" class="btn-primary text-sm">Выдать</button>
      <div id="tariffMsg" class="mt-3 text-sm"></div>
    </div>
  </div>

  <div id="tab-checks" class="pane hidden">
    <div class="glass p-6 max-w-xl">
      <label class="block mb-4 text-sm"><span class="text-white/70">Пользователь</span>
        <select id="checksUser" class="input mt-2"></select></label>
      <label class="block mb-6 text-sm"><span class="text-white/70">Сколько проверок начислить</span>
        <input id="checksAmt" type="number" class="input mt-2" value="50"></label>
      <button id="checksBtn" class="btn-primary text-sm">Начислить</button>
      <div id="checksMsg" class="mt-3 text-sm"></div>
    </div>
  </div>

  <div id="tab-promos" class="pane hidden">
    <div class="glass p-6 max-w-xl mb-6">
      <h3 class="font-bold mb-4">Создать промокод</h3>
      <div class="grid sm:grid-cols-3 gap-3 mb-4">
        <input id="promoCode" class="input" placeholder="КОД">
        <input id="promoPercent" type="number" class="input" placeholder="Скидка %" value="20">
        <input id="promoUses" type="number" class="input" placeholder="Лимит активаций" value="100">
      </div>
      <button id="promoCreateBtn" class="btn-primary text-sm">Создать</button>
      <div id="promoMsg" class="mt-3 text-sm"></div>
    </div>
    <div id="promosList" class="space-y-2"></div>
  </div>

  <div id="tab-support" class="pane hidden">
    <div id="supportList" class="space-y-3"></div>
  </div>

  <div id="tab-feedback" class="pane hidden">
    <div id="feedbackList" class="space-y-3"></div>
  </div>

  <div id="tab-consults" class="pane hidden">
    <div id="consultsList" class="space-y-3"></div>
  </div>

  <div id="tab-laws" class="pane hidden">
    <div class="flex flex-wrap gap-3 mb-4">
      <button id="lawsBaseBtn" class="btn-primary text-sm">🔄 Обновить базовый пакет законов</button>
      <button id="lawsExtBtn" class="btn-ghost text-sm">📚 Догрузить расширенный пакет</button>
    </div>
    <div id="lawsJob" class="text-sm text-white/60 mb-4"></div>
    <div class="glass p-4 mb-4">
      <div class="text-xs text-white/50 mb-2">🔎 Поиск статьи: проверь, загружена ли она в базу</div>
      <div class="flex gap-2">
        <input id="lawQ" class="input flex-1" placeholder="Например: ГК 623 · 359 · удержание · улучшения">
        <button id="lawSearchBtn" class="btn-ghost text-sm">Найти</button>
      </div>
      <div id="lawSearchOut" class="mt-3 space-y-2 text-sm"></div>
    </div>
    <div id="lawsList" class="glass p-4 text-sm space-y-1 max-h-[60vh] overflow-y-auto"></div>
  </div>
</main>

<div id="siteFooter"></div>

<script>
const token = mcaToken();
if (!token) location.href = '/auth.html#login';
const H = {'Authorization': 'Bearer ' + token};
let DATA = {};

document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  document.querySelectorAll('.pane').forEach(p => p.classList.add('hidden'));
  document.getElementById('tab-' + b.dataset.tab).classList.remove('hidden');
});

function showErr(t){ const e = document.getElementById('errBox'); e.classList.remove('hidden'); e.textContent = t; }
function hideErr(){ document.getElementById('errBox').classList.add('hidden'); }

async function act(url, body){
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json', ...H}, body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || ('Ошибка ' + r.status + ' на ' + url));
  return d;
}

function bars(data, color){
  if (!data || !data.length) return '<p class="text-white/50 text-sm">Пока нет данных</p>';
  const max = Math.max(...data.map(x => x.c), 1);
  const txt = color.includes('amber') ? 'text-amber-300' : 'text-sky-300';
  return '<div class="relative" style="height:170px">' +
    [0.25, 0.5, 0.75, 1].map(g =>
      '<div class="absolute left-0 right-0 border-t border-white/5" style="bottom:' + (24 + g * 116) + 'px">' +
      '<span class="absolute -top-2 right-0 text-[10px] text-white/30">' + Math.round(max * g) + '</span></div>').join('') +
    '<div class="absolute left-0 right-0 border-t border-white/20" style="bottom:24px"></div>' +
    '<div class="absolute left-0 right-0 top-0 flex items-end justify-around gap-2 px-2" style="bottom:24px">' +
    data.slice(-12).map(x =>
      '<div class="group flex flex-col items-center justify-end" style="width:46px;height:100%">' +
      '<span class="mb-1 text-xs font-bold ' + txt + '">' + x.c + '</span>' +
      '<div title="' + x.d + ': ' + x.c + '" style="height:' + Math.max(4, Math.round(x.c / max * 112)) + 'px" class="w-full rounded-t-md ' + color + ' transition-all group-hover:brightness-125"></div>' +
      '</div>').join('') + '</div>' +
    '<div class="absolute left-0 right-0 bottom-0 flex justify-around gap-2 px-2">' +
    data.slice(-12).map(x => '<span class="w-[46px] text-center text-[10px] text-white/40">' + String(x.d || '').slice(5) + '</span>').join('') +
    '</div></div>';
}

function userLabel(u){ return (u.email || '') + ' — ' + (u.tariff || 'Free') + ' (' + (u.checks_left ?? 0) + ' пров.)'; }

function renderAll(){
  const s = DATA.stats || {};
  document.getElementById('statCards').innerHTML = [
    ['👥 Пользователей', s.users ?? 0], ['✅ Верифицировано', s.verified ?? 0],
    ['📄 Анализом', s.analyses ?? 0], ['📑 Договором', s.contracts ?? 0],
    ['📚 Законов в базе', s.laws ?? 0], ['⭐ Средняя оценка', s.feedback_avg ?? '—'],
    ['📩 Открытых обращений', s.support_open ?? 0], ['💳 Платных выдач', s.paid ?? 0]
  ].map(c => '<div class="glass p-5"><div class="text-xs text-white/50 mb-1">' + c[0] + '</div><div class="text-2xl font-extrabold">' + c[1] + '</div></div>').join('');
  document.getElementById('regsChart').innerHTML = bars(DATA.regs || [], 'bg-amber-500');
  document.getElementById('anlsChart').innerHTML = bars(DATA.anls || [], 'bg-sky-500');
  document.getElementById('topPromos').innerHTML = (DATA.top_promos || []).length
    ? (DATA.top_promos || []).map(p => '<div class="flex justify-between"><span class="font-bold">' + mcaEsc(p.code) + '</span><span class="text-white/60">активаций: ' + (p.used_count ?? 0) + '</span></div>').join('')
    : '<p class="text-white/50">Промокодов пока нет.</p>';

  renderUsers();
  const opts = (DATA.users || []).map(u => '<option value="' + u.id + '">' + mcaEsc(userLabel(u)) + '</option>').join('');
  document.getElementById('tariffUser').innerHTML = opts || '<option value="">Нет пользователей</option>';
  document.getElementById('checksUser').innerHTML = opts || '<option value="">Нет пользователей</option>';

  document.getElementById('promosList').innerHTML = (DATA.promos || []).length
    ? (DATA.promos || []).map(p =>
      '<div class="glass p-4 flex flex-wrap items-center justify-between gap-3">' +
      '<div><b>' + mcaEsc(p.code) + '</b> · скидка ' + (p.percent ?? 0) + '% · активаций ' + (p.used_count ?? 0) + '/' + (p.max_uses ?? '∞') + '</div>' +
      '<button data-pt="' + mcaEsc(p.code) + '" class="btn-ghost text-sm">' + (p.disabled ? '▶ Включить' : '⏸ Выключить') + '</button></div>').join('')
    : '<p class="text-white/50">Промокодов пока нет.</p>';
  document.querySelectorAll('[data-pt]').forEach(b => b.onclick = async () => {
    try { await act('/api/admin/promo_toggle', {code: b.dataset.pt}); loadAll(); } catch(e){ showErr('❌ ' + e.message); }
  });

  document.getElementById('supportList').innerHTML = (DATA.support || []).length
    ? (DATA.support || []).map(m =>
      '<div class="glass p-5">' +
      '<div class="text-xs text-white/50 mb-1">' + mcaEsc(m.email || '') + ' · ' + (m.created_at || '') + '</div>' +
      '<div class="text-sm mb-3">' + mcaEsc(m.text || '') + '</div>' +
      (m.reply ? '<div class="text-sm text-green-300 mb-2">↩ Ответ отправлен: ' + mcaEsc(m.reply) + '</div>' : '') +
      '<div class="flex gap-2"><input id="sr' + m.id + '" class="input flex-1 text-sm" placeholder="Текст ответа…">' +
      '<button data-sr="' + m.id + '" class="btn-primary text-sm">Ответить</button></div></div>').join('')
    : '<p class="text-white/50">Обращений нет.</p>';
  document.querySelectorAll('[data-sr]').forEach(b => b.onclick = async () => {
    try {
      await act('/api/admin/support_reply', {message_id: +b.dataset.sr, text: document.getElementById('sr' + b.dataset.sr).value});
      loadAll();
    } catch(e){ showErr('❌ ' + e.message); }
  });

  document.getElementById('feedbackList').innerHTML = (DATA.feedback || []).length
    ? (DATA.feedback || []).map(f =>
      '<div class="glass p-5"><div class="text-xs text-white/50 mb-1">' + mcaEsc(f.email || '') + ' · ' + '⭐'.repeat(f.rating || 0) + '</div>' +
      '<div class="text-sm">' + mcaEsc(f.comment || '') + '</div></div>').join('')
    : '<p class="text-white/50">Отзывов нет.</p>';

  document.getElementById('consultsList').innerHTML = (DATA.consults || []).length
    ? (DATA.consults || []).map(c =>
      '<div class="glass p-5">' +
      '<div class="text-xs text-white/50 mb-1">' + mcaEsc(c.email || '') + ' · ' + (c.created_at || '') + '</div>' +
      '<div class="text-sm mb-3">' + mcaEsc(c.text || '') + '</div>' +
      '<div class="flex gap-2"><input id="cr' + c.id + '" class="input flex-1 text-sm" placeholder="Ответ юриста…">' +
      '<button data-cr="' + c.id + '" class="btn-primary text-sm">Ответить</button></div></div>').join('')
    : '<p class="text-white/50">Заявок нет.</p>';
  document.querySelectorAll('[data-cr]').forEach(b => b.onclick = async () => {
    try {
      await act('/api/admin/consult_reply', {id: +b.dataset.cr, text: document.getElementById('cr' + b.dataset.cr).value});
      loadAll();
    } catch(e){ showErr('❌ ' + e.message); }
  });

  const lawsArr = DATA.laws || DATA.laws_list || DATA.laws_rows || [];
  document.getElementById('lawsList').innerHTML = lawsArr.length
    ? lawsArr.map(l =>
      '<div class="flex justify-between gap-3 py-1 border-b border-white/5">' +
      '<span><b>' + mcaEsc(l.code) + '</b> — ' + mcaEsc(l.title || '') + '</span>' +
      '<span class="text-white/50 shrink-0">' + (l.ft || 0) + ' симв. текста</span></div>').join('')
    : '<p class="text-white/50">База пуста — нажми «Обновить базовый пакет».</p>';
}

function renderUsers(){
  const q = (document.getElementById('userSearch').value || '').toLowerCase();
  const list = (DATA.users || []).filter(u => !q || (u.email || '').toLowerCase().includes(q) || String(u.id).includes(q));
  document.getElementById('usersList').innerHTML = list.length
    ? list.map(u =>
      '<div class="glass p-4 flex flex-wrap items-center justify-between gap-3">' +
      '<div><b>' + mcaEsc(u.email) + '</b> #' + u.id +
      '<div class="text-xs text-white/50 mt-1">' + (u.tariff || 'Free') + ' · проверок: ' + (u.checks_left ?? 0) +
      ' · ' + (u.verified ? '✅ верифицирован' : '⏳ не верифицирован') + ' · ' + (u.created_at || '') + '</div></div>' +
      '<div class="flex gap-2">' +
      '<button data-rp="' + u.id + '" class="btn-ghost text-sm">🔑 Сброс пароля</button>' +
      '<button data-du="' + u.id + '" class="btn-ghost text-sm" style="border-color:rgba(248,113,113,.4);color:#fca5a5">🗑 Удалить</button>' +
      '</div></div>').join('')
    : '<p class="text-white/50">Никого не найдено.</p>';
  document.querySelectorAll('[data-rp]').forEach(b => b.onclick = async () => {
    try { const d = await act('/api/admin/reset_password', {user_id: +b.dataset.rp}); alert('🔑 Временный пароль: ' + d.password); } catch(e){ showErr('❌ ' + e.message); }
  });
  document.querySelectorAll('[data-du]').forEach(b => b.onclick = async () => {
    const ok = await mcaConfirm('Удалить пользователя?', 'Аккаунт и все его данные будут стёрты безвозвратно.');
    if (!ok) return;
    try { await act('/api/admin/user_delete', {user_id: +b.dataset.du}); loadAll(); } catch(e){ showErr('❌ ' + e.message); }
  });
}
document.getElementById('userSearch').oninput = renderUsers;

async function loadAll(){
  hideErr();
  const r = await fetch('/api/admin/all', {headers: H});
  if (!r.ok) {
    showErr('❌ Не удалось загрузить данные (код ' + r.status + '). Выполни на сервере: systemctl restart mca-api, затем обнови страницу.');
    return;
  }
  DATA = await r.json();
  renderAll();
}
document.getElementById('refreshBtn').onclick = loadAll;

document.getElementById('tariffBtn').onclick = async () => {
  try {
    await act('/api/admin/tariff', {
      user_id: +document.getElementById('tariffUser').value,
      tariff: document.getElementById('tariffSel').value,
      promo: document.getElementById('tariffPromo').value.trim()
    });
    document.getElementById('tariffMsg').textContent = '✅ Тариф выдан, проверки начислены.';
    loadAll();
  } catch(e){ document.getElementById('tariffMsg').textContent = '❌ ' + e.message; }
};
document.getElementById('checksBtn').onclick = async () => {
  try {
    await act('/api/admin/checks', {
      user_id: +document.getElementById('checksUser').value,
      amount: +document.getElementById('checksAmt').value
    });
    document.getElementById('checksMsg').textContent = '✅ Проверки начислены.';
    loadAll();
  } catch(e){ document.getElementById('checksMsg').textContent = '❌ ' + e.message; }
};
document.getElementById('promoCreateBtn').onclick = async () => {
  try {
    await act('/api/admin/promo', {
      code: document.getElementById('promoCode').value.trim().toUpperCase(),
      percent: +document.getElementById('promoPercent').value,
      max_uses: +document.getElementById('promoUses').value
    });
    document.getElementById('promoMsg').textContent = '✅ Промокод создан.';
    loadAll();
  } catch(e){ document.getElementById('promoMsg').textContent = '❌ ' + e.message; }
};

function startLaws(pack){
  act('/api/admin/laws_reload_v2', {pack: pack}).then(pollJob).catch(e => showErr('❌ ' + e.message));
}
function pollJob(){
  fetch('/api/admin/laws_job_v2', {headers: H}).then(r => r.json()).then(j => {
    const box = document.getElementById('lawsJob');
    if (!j || !j.running && !j.last) { box.textContent = ''; return; }
    box.innerHTML = (j.running ? '⏳ Выполняется: ' : '✅ Готово: ') +
      (j.done ?? 0) + '/' + (j.total ?? 0) + ' · ' + mcaEsc(j.current || '') +
      (j.log && j.log.length ? '<div class="mt-2 glass p-3 max-h-40 overflow-y-auto text-xs space-y-1">' +
        j.log.slice(-8).map(l => '<div>' + mcaEsc(l) + '</div>').join('') + '</div>' : '');
    if (j.running) setTimeout(pollJob, 4000); else loadAll();
  }).catch(() => {});
}
document.getElementById('lawsBaseBtn').onclick = () => startLaws('base');
document.getElementById('lawsExtBtn').onclick = () => startLaws('ext');

document.getElementById('lawSearchBtn').onclick = async () => {
  const q = document.getElementById('lawQ').value.trim();
  const out = document.getElementById('lawSearchOut');
  if (!q) return;
  out.innerHTML = '<p class="text-white/50">⏳ Ищу…</p>';
  const r = await fetch('/api/admin/laws_search_v2?q=' + encodeURIComponent(q), {headers: H});
  const list = await r.json().catch(() => []);
  if (!r.ok) { out.innerHTML = '<p class="text-red-400">❌ Ошибка поиска</p>'; return; }
  if (!list.length) { out.innerHTML = '<p class="text-red-400">❌ Ничего не найдено по запросу.</p>'; return; }
  out.innerHTML = list.map(x => x.loaded
    ? '<div class="p-3 rounded-xl bg-green-500/10 border border-green-500/30"><b>' + mcaEsc(x.code) + ' · ст. ' + mcaEsc(x.art) + '</b> — загружена ✅<div class="text-white/60 text-xs mt-1">' + mcaEsc(x.snippet) + '</div></div>'
    : '<div class="p-3 rounded-xl bg-red-500/10 border border-red-500/30"><b>' + mcaEsc(x.code) + ' · ст. ' + mcaEsc(x.art) + '</b> — НЕ загружена ❌<div class="text-white/60 text-xs mt-1">' + mcaEsc(x.snippet) + '</div></div>').join('');
};

mcaNav(); mcaFooter(); loadAll(); pollJob();
</script>
</body>
</html>
