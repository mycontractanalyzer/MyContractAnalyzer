<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ-юрист 24/7 — MyContractAnalyzer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/style.css">
<script src="/ui.js"></script>
</head>
<body class="min-h-screen">
<div class="orb orb-a"></div><div class="orb orb-b"></div>
<div id="siteNav"></div>

<main class="max-w-6xl mx-auto px-6 py-10 grid lg:grid-cols-4 gap-8 relative z-10">
  <section class="lg:col-span-3">
    <div class="flex flex-wrap items-center gap-3 mb-4">
      <h1 class="text-3xl font-bold">🤖 ИИ-юрист 24/7</h1>
      <span id="lawyerLeft" class="chip" style="display:none"></span>
    </div>
    <p id="ctxNote" class="text-white/60 text-sm mb-6">Чат по любым правовым вопросам. Ответ печатается вживую и сразу оформлен для чтения.</p>

    <div id="backRow" class="hidden mb-4">
      <button id="newChatBtn" class="btn-ghost text-sm">← Назад к новому диалогу</button>
    </div>

    <div id="chat" class="glass p-6 space-y-4 min-h-[50vh] max-h-[60vh] overflow-y-auto mb-4"></div>

    <div class="flex gap-3">
      <input id="q" class="input flex-1" placeholder="Задай вопрос…">
      <button id="send" class="btn-primary">Отправить</button>
    </div>
  </section>

  <aside>
    <h2 class="font-bold mb-4">🗂 История юриста</h2>
    <div id="histList" class="space-y-2"></div>
  </aside>
</main>

<div id="siteFooter"></div>

<script>
const token = mcaToken();
if (!token) location.href = '/auth.html#login';
const H = {'Authorization': 'Bearer ' + token};
const chat = document.getElementById('chat');
const aid = new URLSearchParams(location.search).get('aid');
const endpoint = aid ? '/api/lawyer_analysis' : '/api/lawyer';

function setChip(left, limit, isAnalysis){
  const el = document.getElementById('lawyerLeft');
  el.style.display = 'inline-flex';
  if (limit <= 0) {
    el.textContent = isAnalysis ? 'Вопросы юристу по анализу доступны с тарифа Standard' : 'ИИ-юрист доступен на тарифах Pro, Business и Business Pro';
    el.style.color = '#fca5a5';
  } else {
    el.textContent = isAnalysis ? ('Вопросов по договору: ' + left + ' из ' + limit) : ('Осталось обращений сегодня: ' + left + ' из ' + limit);
    el.style.color = '';
  }
}
function loadLeft(){
  const url = aid ? ('/api/lawyer_analysis_left?analysis_id=' + aid) : '/api/lawyer_left';
  fetch(url, {headers: H}).then(r => r.ok ? r.json() : {limit: 0, left: 0})
    .then(d => setChip(d.left, d.limit, !!aid)).catch(() => {});
}
if (aid) {
  document.getElementById('ctxNote').innerHTML =
    'Режим «по договору»: юрист видит текст договора и готовый отчёт №' + aid + ' — отвечает максимально точно по твоим пунктам.';
}
loadLeft();

function updateBack(){
  document.getElementById('backRow').classList.toggle('hidden', chat.children.length === 0);
}
function bubble(cls){
  const d = document.createElement('div');
  d.className = 'p-4 rounded-2xl text-sm leading-relaxed ' + cls;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  updateBack();
  return d;
}

async function loadHist(){
  const r = await fetch('/api/lawyer_chats', {headers: H});
  if (!r.ok) return;
  const list = await r.json();
  document.getElementById('histList').innerHTML = list.length ? list.map(c =>
    '<div class="hist relative">' +
    '<button data-id="' + c.id + '" class="block w-full text-left pr-8">' +
    '<div class="font-semibold text-sm">' + mcaEsc((c.question || '').slice(0, 60)) + '</div>' +
    '<div class="text-xs text-white/50 mt-1">' + (c.analysis_id ? ('по договору #' + c.analysis_id + ' · ') : '') + (c.created_at || '') + '</div></button>' +
    '<button data-del="' + c.id + '" class="absolute right-2 top-2 text-white/40 hover:text-red-400" title="Удалить диалог">⋮</button></div>').join('')
    : '<p class="text-white/50 text-sm">Пока пусто.</p>';
  document.querySelectorAll('#histList [data-id]').forEach(b => b.onclick = () => {
    const c = list.find(x => x.id == b.dataset.id);
    chat.innerHTML = '';
    bubble('bg-amber-500/15 border border-amber-500/30 rounded-tr-sm').textContent = c.question;
    bubble('glass rounded-tl-sm').innerHTML = mcaMd(c.answer || '');
  });
  document.querySelectorAll('#histList [data-del]').forEach(b => b.onclick = async () => {
    const ok = await mcaConfirm('Удалить диалог с юристом?', 'Вопрос и ответ будут удалены из истории безвозвратно.');
    if (!ok) return;
    await fetch('/api/lawyer_chats/' + b.dataset.del, {method: 'DELETE', headers: H});
    loadHist();
  });
}
loadHist();

async function ask(){
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  document.getElementById('q').value = '';
  bubble('bg-amber-500/15 border border-amber-500/30 rounded-tr-sm').textContent = q;
  const bot = bubble('glass rounded-tl-sm');
  bot.innerHTML = '<span class="text-white/50">⏳ Думаю…</span>';
  let out = '';
  try {
    const body = aid ? {analysis_id: +aid, question: q} : {question: q, history: []};
    const r = await fetch(endpoint, {method: 'POST', headers: {'Content-Type': 'application/json', ...H}, body: JSON.stringify(body)});
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      bot.innerHTML = '<span class="text-red-400">❌ ' + mcaEsc(d.detail || 'Ошибка') + '</span>';
      return;
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, i); buf = buf.slice(i + 2);
        try {
          const obj = JSON.parse(raw.replace(/^data: /, ''));
          if (obj.chunk) { out += obj.chunk; bot.innerHTML = mcaMd(out); chat.scrollTop = chat.scrollHeight; }
          if (obj.done) { loadLeft(); loadHist(); }
        } catch(e) {}
      }
    }
    if (!out) bot.innerHTML = '<span class="text-white/50">Пустой ответ.</span>';
  } catch(e) {
    bot.innerHTML = '<span class="text-red-400">❌ Сеть недоступна</span>';
  }
}
document.getElementById('newChatBtn').onclick = () => {
  chat.innerHTML = '';
  document.getElementById('q').value = '';
  updateBack();
  document.getElementById('q').focus();
};
document.getElementById('send').onclick = ask;
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
mcaNav(); mcaFooter();
</script>
</body>
</html>
