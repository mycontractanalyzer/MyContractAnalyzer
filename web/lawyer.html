<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ-юрист 24/7 — MyContractAnalyzer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/style.css">
<script src="/ui.js"></script>
</head>
<body class="min-h-screen flex flex-col">
<div class="orb orb-a"></div><div class="orb orb-b"></div>
<div id="siteNav"></div>

<main class="max-w-4xl mx-auto px-6 py-8 flex-1 flex flex-col w-full relative z-10">
  <h1 class="text-2xl font-bold mb-2">🤖 ИИ-юрист 24/7</h1>
  <p class="text-white/60 text-sm mb-6">Чат по любым правовым вопросам (Pro, Business, Business Pro). Ответ печатается вживую. <span id="lawyerLeft" class="chip ml-2" style="display:none"></span></p>
  <div id="chat" class="flex-1 space-y-4 overflow-y-auto mb-4 pr-2"></div>
  <form id="form" class="flex gap-3">
    <input id="q" placeholder="Например: могут ли уволить во время отпуска?" class="input">
    <button class="btn-primary">Спросить</button>
  </form>
</main>

<div id="siteFooter"></div>

<script>
const token = mcaToken();
if (!token) location.href = '/auth.html#login';
const hist = [];
const chat = document.getElementById('chat');
function addMsg(role, text){
  const d = document.createElement('div');
  d.className = role === 'user'
    ? 'p-4 rounded-2xl rounded-tr-sm bg-amber-500/15 border border-amber-500/30 text-sm whitespace-pre-wrap'
    : 'p-4 rounded-2xl rounded-tl-sm glass text-sm whitespace-pre-wrap';
  d.textContent = (role === 'user' ? 'Ты: ' : 'Юрист: ') + text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  document.getElementById('q').value = '';
  addMsg('user', q);
  const bot = addMsg('bot', '');
  let out = '';
  try {
    const r = await fetch('/api/lawyer', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
      body: JSON.stringify({question: q, history: hist.slice(-5)})
    });
    if (!r.ok) {
      const d = await r.json();
      bot.textContent = 'Юрист: ❌ ' + (d.detail || 'Ошибка');
      return;
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, i); buf = buf.slice(i + 2);
        try {
          const obj = JSON.parse(raw.replace(/^data: /, ''));
          if (obj.chunk) { out += obj.chunk; bot.textContent = 'Юрист: ' + out; chat.scrollTop = chat.scrollHeight; }
          if (obj.left !== undefined) { const el = document.getElementById('lawyerLeft'); if (el) { el.textContent = 'Осталось обращений сегодня: ' + obj.left; el.style.display = 'inline-flex'; } }
        } catch(e) {}
      }
    }
    hist.push([q, out]);
  } catch(err) {
    bot.textContent = 'Юрист: ❌ Сеть недоступна';
  }
});
mcaNav(); mcaFooter();
</script>
</body>
</html>
