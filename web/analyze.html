<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анализ договора — MyContractAnalyzer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/style.css">
<script src="/ui.js"></script>
</head>
<body class="min-h-screen">
<div class="orb orb-a"></div><div class="orb orb-b"></div>
<div id="siteNav"></div>

<main class="max-w-6xl mx-auto px-6 py-10 grid lg:grid-cols-3 gap-8 relative z-10">
  <section class="lg:col-span-2 space-y-6">
    <h1 class="text-3xl font-bold">📄 Анализ договора</h1>

    <div class="glass p-6 space-y-5">
      <label class="block">
        <span class="text-white/70 text-sm">Текст договора</span>
        <textarea id="contractText" rows="12" placeholder="Вставь текст договора сюда…" class="input mt-2 text-sm"></textarea>
      </label>

      <label class="dropzone block" id="dz">
        <span class="dz-icon">📂</span>
        <b>Перетащи файл сюда или кликни для выбора</b>
        <span class="block text-sm text-white/50 mt-1">TXT · MD · PDF · DOCX · PNG/JPG (фото распознаётся OCR)</span>
        <input id="fileInput" type="file" accept=".txt,.md,.pdf,.docx,.png,.jpg,.jpeg">
      </label>

      <div class="flex flex-wrap items-center gap-3">
        <span id="charCount" class="chip">0 символов</span>
        <span id="fileMsg" class="text-sm text-white/60"></span>
      </div>

      <div>
        <span class="text-white/70 text-sm block mb-2">Глубина анализа</span>
        <div class="flex flex-wrap gap-3">
          <label class="chip cursor-pointer has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/10 has-[:checked]:text-amber-300"><input type="radio" name="depth" value="brief" class="accent-amber-500 mr-1">⚡ Краткий</label>
          <label class="chip cursor-pointer has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/10 has-[:checked]:text-amber-300"><input type="radio" name="depth" value="standard" checked class="accent-amber-500 mr-1">⚙️ Стандарт</label>
          <label class="chip cursor-pointer has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/10 has-[:checked]:text-amber-300"><input type="radio" name="depth" value="detailed" class="accent-amber-500 mr-1">🔬 Развёрнутый</label>
        </div>
      </div>

      <button id="runBtn" class="btn-primary w-full text-lg">🚀 Анализировать</button>

      <div id="progressWrap" class="hidden">
        <div class="h-2 rounded-full bg-white/10 overflow-hidden">
          <div id="progressBar" class="h-full bg-gradient-to-r from-amber-400 to-amber-600 transition-all" style="width:1%"></div>
        </div>
        <p id="progressText" class="mt-2 text-sm text-white/60">Договор анализируется… 0%</p>
      </div>
    </div>

    <div id="reportBox" class="glass p-6 hidden">
      <div id="reportContent" class="text-sm leading-relaxed"></div>
      <div id="reportActions" class="hidden mt-6">
        <a id="openReport" href="#" class="btn-primary">📊 Открыть полный отчёт с инструментами</a>
      </div>
    </div>
  </section>

  <aside>
    <h2 class="font-bold mb-4">📚 Мои отчёты</h2>
    <div id="historyList" class="space-y-2"></div>
  </aside>
</main>

<div id="siteFooter"></div>

<script>
const token = mcaToken();
if (!token) location.href = '/auth.html#login';
const MAXT = {brief: 700, standard: 1800, detailed: 4500};
const TIER_CHARS = {'Free':15000,'Light':35000,'Standard':50000,'Pro':100000,'Business':150000,'Business Pro':200000};
let myTariff = 'Free';
const ta = document.getElementById('contractText');
const dz = document.getElementById('dz');

fetch('/api/me', {headers: {'Authorization': 'Bearer ' + token}})
  .then(r => r.ok ? r.json() : null)
  .then(u => { if (u) { myTariff = u.tariff; ta.dispatchEvent(new Event('input')); } })
  .catch(() => {});

ta.addEventListener('input', () => {
  const cap = TIER_CHARS[myTariff] || 15000;
  const n = ta.value.length;
  const el = document.getElementById('charCount');
  el.textContent = n + ' символов · лимит тарифа: ' + cap;
  el.style.color = n > cap ? '#f87171' : '';
});
['dragover','dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
dz.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});
document.getElementById('fileInput').addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

async function handleFile(f){
  const msg = document.getElementById('fileMsg');
  const low = f.name.toLowerCase();
  if (low.endsWith('.txt') || low.endsWith('.md')) {
    ta.value = await f.text();
    ta.dispatchEvent(new Event('input'));
    msg.textContent = '✅ ' + f.name;
    return;
  }
  const isImage = low.endsWith('.png') || low.endsWith('.jpg') || low.endsWith('.jpeg');
  const url = isImage ? '/api/upload_ocr' : '/api/upload';
  msg.textContent = isImage ? '⏳ Распознаю текст с фото…' : '⏳ Сервер читает файл…';
  try {
    const fd = new FormData();
    fd.append('file', f);
    const r = await fetch(url, {method: 'POST', headers: {'Authorization': 'Bearer ' + token}, body: fd});
    const d = await r.json();
    if (r.ok) {
      ta.value = d.text;
      ta.dispatchEvent(new Event('input'));
      msg.textContent = '✅ ' + f.name + ' (' + d.chars + ' символов)';
    } else {
      msg.textContent = '❌ ' + (d.detail || 'Не удалось прочитать файл');
    }
  } catch (err) { msg.textContent = '❌ Сеть недоступна'; }
}

document.getElementById('runBtn').onclick = async () => {
  const text = ta.value.trim();
  if (!text) { alert('Вставь текст договора или загрузи файл'); return; }
  const cap2 = TIER_CHARS[myTariff] || 15000;
  if (text.length > cap2) { alert('❌ Лимит тарифа ' + myTariff + ': до ' + cap2 + ' символов за проверку. Раздели документ или повысь тариф.'); return; }
  const depth = document.querySelector('input[name="depth"]:checked').value;
  const box = document.getElementById('reportBox');
  const content = document.getElementById('reportContent');
  const wrap = document.getElementById('progressWrap');
  document.getElementById('reportActions').classList.add('hidden');
  box.classList.remove('hidden'); wrap.classList.remove('hidden');
  content.innerHTML = '<p class="text-white/60 text-sm">⏳ Запускаю анализ…</p>';
  let out = '';
  try {
    const r = await fetch('/api/analyze', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
      body: JSON.stringify({text, depth})
    });
    if (!r.ok) {
      const d = await r.json();
      alert('❌ ' + (d.detail || 'Ошибка анализа'));
      wrap.classList.add('hidden');
      return;
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const rawChunk = buf.slice(0, i); buf = buf.slice(i + 2);
        try {
          const obj = JSON.parse(rawChunk.replace(/^data: /, ''));
          if (obj.chunk) {
            out += obj.chunk;
            const visible = out.split('HIGHLIGHTS_JSON:')[0];
            content.innerHTML = mcaMd(visible);
            const pct = Math.min(99, Math.round(visible.length / 2.5 / MAXT[depth] * 100));
            document.getElementById('progressBar').style.width = Math.max(pct, 1) + '%';
            document.getElementById('progressText').textContent = 'Договор анализируется… ' + pct + '%';
          }
          if (obj.done) {
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('progressText').textContent = '✅ Готово! Отчёт сохранён.';
            document.getElementById('openReport').href = '/report.html?id=' + obj.analysis_id;
            document.getElementById('reportActions').classList.remove('hidden');
            loadHistory();
          }
        } catch(e) {}
      }
    }
  } catch(e) {
    alert('❌ Сеть недоступна');
  }
};

async function loadHistory(){
  try {
    const r = await fetch('/api/analyses', {headers: {'Authorization': 'Bearer ' + token}});
    const list = await r.json();
    document.getElementById('historyList').innerHTML = list.map(a =>
      '<a href="/report.html?id=' + a.id + '" class="hist block">' +
      '<div class="font-semibold text-sm">' + mcaEsc(a.title || a.type || 'Договор') + ' · #' + a.id + '</div>' +
      '<div class="text-xs text-white/50 mt-1">' + (a.created_at || '') + '</div></a>').join('')
      || '<p class="text-white/50 text-sm">Пока пусто.</p>';
  } catch(e) {}
}
mcaNav(); mcaFooter(); loadHistory();
</script>
</body>
</html>
