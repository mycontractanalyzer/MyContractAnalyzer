<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отчёт — MyContractAnalyzer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/style.css">
<script src="/ui.js"></script>
</head>
<body class="min-h-screen">
<div class="orb orb-a"></div><div class="orb orb-b"></div>
<div id="siteNav"></div>

<main class="max-w-6xl mx-auto px-6 py-10 grid lg:grid-cols-4 gap-8 relative z-10">
  <section class="lg:col-span-3">
    <div id="pubNote" class="hidden mb-6 p-4 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-sm">
      📄 Отчёт открыт по ссылке владельца в режиме чтения. Сгенерировано MyContractAnalyzer — <a href="/auth.html#signup" class="text-amber-400 underline">проверь и свой договор</a>.
    </div>
    <div id="scoreBadge" class="mb-6"></div>

    <div id="dlRow" class="flex flex-wrap gap-3 mb-4">
      <button id="dlPdf" class="btn-primary text-sm">📄 Скачать PDF</button>
      <button id="dlDocx" class="btn-ghost text-sm">📝 Скачать DOCX</button>
      <button id="dlProto" class="btn-ghost text-sm">🧾 Протокол разногласий (DOCX)</button>
      <button id="dlAudio" class="btn-ghost text-sm">🔊 Аудиоверсия</button>
    </div>
    <div id="audioBox" class="hidden mb-6"></div>

    <div id="actionsRow" class="flex flex-wrap gap-3 mb-6">
      <button id="shareBtn" class="btn-ghost text-sm">🔗 Поделиться по ссылке</button>
      <button id="renameBtn" class="btn-ghost text-sm">✏️ Переименовать</button>
      <button id="emailBtn" class="btn-ghost text-sm">📧 Отправить на почту (PDF)</button>
      <a id="toLawyer" href="/lawyer.html" class="btn-ghost text-sm">🤖 Уточнить у ИИ-юриста</a>
      <span id="shareMsg" class="text-sm text-white/60 self-center"></span>
    </div>

    <div class="flex flex-wrap gap-2 mb-6 text-sm">
      <button data-tab="report" class="tab-btn on">📄 Отчёт</button>
      <button data-tab="contract" class="tab-btn" id="tabContractBtn">📑 Договор с подсветкой</button>
      <button data-tab="tools" class="tab-btn" id="tabToolsBtn">🧰 Инструменты</button>
      <button data-tab="search" class="tab-btn" id="tabSearchBtn">🔍 Поиск по пункту</button>
      <button data-tab="feedback" class="tab-btn" id="tabFeedbackBtn">⭐ Отзыв</button>
    </div>

    <div id="tab-report" class="pane">
      <div id="cards"></div>
      <div id="reportBody" class="text-sm leading-relaxed mt-4 glass p-6"></div>
    </div>

    <div id="tab-contract" class="pane hidden">
      <div id="contractBody" class="text-sm leading-relaxed whitespace-pre-wrap glass p-6"></div>
    </div>

    <div id="tab-tools" class="pane hidden">
      <div id="toolButtons" class="flex flex-wrap gap-2 mb-4"></div>
      <div class="glass p-4 mb-4 border-amber-500/30">
        <label class="block text-sm"><span class="text-white/70">🤖 Задать вопрос по анализу ИИ-юристу</span>
          <input id="lawyerQ" class="input mt-2" placeholder="Например: ничтожен ли п. 3.7? Что ответить контрагенту по п. 3.4?"></label>
        <button id="lawyerAskBtn" class="btn-primary text-sm mt-3">Спросить юриста</button>
        <span id="lawyerLeftAnalysis" class="chip ml-2" style="display:none"></span>
        <div id="lawyerOut" class="text-sm leading-relaxed mt-3 hidden glass p-4"></div>
      </div>
      <div id="toolOut" class="text-sm leading-relaxed glass p-6 whitespace-pre-wrap">Выбери инструмент…</div>
    </div>

    <div id="tab-search" class="pane hidden">
      <div class="flex gap-3 mb-4">
        <input id="clauseQ" placeholder="Номер пункта, например 5.2 или 7.6" class="input">
        <button id="clauseBtn" class="btn-primary text-sm">Найти</button>
      </div>
      <div id="clauseOut" class="text-sm space-y-3"></div>
    </div>

    <div id="tab-feedback" class="pane hidden">
      <div class="glass p-6">
        <label class="block mb-4 text-sm"><span class="text-white/70">Оценка</span>
          <select id="fbRating" class="input mt-2">
            <option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option>
            <option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option>
          </select></label>
        <label class="block mb-4 text-sm"><span class="text-white/70">Комментарий</span>
          <textarea id="fbComment" rows="4" class="input mt-2"></textarea></label>
        <button id="fbBtn" class="btn-primary text-sm">Отправить отзыв</button>
        <div id="fbMsg" class="mt-3 text-sm"></div>
      </div>
    </div>
  </section>

  <aside id="sideHist">
    <h2 class="font-bold mb-4">📚 Мои отчёты</h2>
    <div id="historyList" class="space-y-2"></div>
  </aside>
</main>

<div id="siteFooter"></div>

<script>
const token = mcaToken();
const isAuth = !!token;
const H = isAuth ? {'Authorization': 'Bearer ' + token} : {};
const params = new URLSearchParams(location.search);
let aid = params.get('id');
let reportRaw = '', contractText = '';

document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  document.querySelectorAll('.pane').forEach(p => p.classList.add('hidden'));
  document.getElementById('tab-' + b.dataset.tab).classList.remove('hidden');
});

function paint(detail){
  reportRaw = (detail.report || '').split('HIGHLIGHTS_JSON:')[0];
  const m = reportRaw.match(/Риск-скор:\s*(\d{1,3})\/100/);
  if (m) {
    const s = +m[1];
    const cls = s <= 30 ? 'text-green-400 border-green-500/40 bg-green-500/10'
      : s <= 70 ? 'text-amber-400 border-amber-500/40 bg-amber-500/10'
      : 'text-red-400 border-red-500/40 bg-red-500/10';
    const v = s <= 30 ? '✅ Можно подписывать' : s <= 70 ? '🟡 С осторожностью' : '❌ Не подписывать без правок';
    document.getElementById('scoreBadge').innerHTML =
      '<div class="inline-block px-6 py-3 rounded-2xl border ' + cls + ' text-xl font-bold">🎯 Риск-скор: ' + s + '/100 — ' + v + '</div>';
  }
  let cards = '';
  try {
    const hl = JSON.parse(detail.highlights || '[]');
    const red = hl.filter(x => x.level === 'red'), yel = hl.filter(x => x.level !== 'red');
    if (red.length) cards += '<h3 class="font-bold text-lg mb-3">🔴 Критические риски (' + red.length + ')</h3>' + red.map(x =>
      '<div class="mb-3 p-4 rounded-xl bg-red-500/10 border border-red-500/30"><div class="font-semibold text-sm">' + mcaEsc(x.quote) +
      '</div><div class="text-sm text-white/70 mt-2">' + mcaEsc(x.reason) + '</div></div>').join('');
    if (yel.length) cards += '<h3 class="font-bold text-lg mt-4 mb-3">🟡 Стоит уточнить (' + yel.length + ')</h3>' + yel.map(x =>
      '<div class="mb-3 p-4 rounded-xl bg-amber-500/10 border border-amber-500/30"><div class="font-semibold text-sm">' + mcaEsc(x.quote) +
      '</div><div class="text-sm text-white/70 mt-2">' + mcaEsc(x.reason) + '</div></div>').join('');
  } catch(e) {}
  document.getElementById('cards').innerHTML = cards;
  document.getElementById('reportBody').innerHTML = mcaMd(reportRaw);
}

async function loadContract(id){
  const rc = await fetch('/api/analyses/' + id + '/contract', {headers: H});
  if (!rc.ok) return;
  const cd = await rc.json();
  contractText = cd.text || '';
  let html = mcaEsc(contractText);
  const markFuzzy = (src, q, st) => {
    const words = q.trim().split(/\s+/).filter(w => w.length > 2).slice(0, 10);
    if (!words.length) return src;
    const rx = new RegExp(words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('[\\s\\S]{0,6}?'), 'i');
    return src.replace(rx, m => '<mark style="' + st + '">' + m + '</mark>');
  };
  try {
    const r = await fetch('/api/analyses/' + id, {headers: H});
    const d = await r.json();
    const hl = JSON.parse(d.highlights || '[]');
    hl.forEach(x => {
      const st = x.level === 'red'
        ? 'background:#7f1d1d;color:#fecaca;padding:0 3px;border-radius:3px'
        : 'background:#78350f;color:#fde68a;padding:0 3px;border-radius:3px';
      html = markFuzzy(html, mcaEsc(x.quote), st);
    });
  } catch(e) {}
  document.getElementById('contractBody').innerHTML = html;
}

async function loadReport(id){
  aid = id;
  const r = await fetch('/api/analyses/' + id, {headers: H});
  if (!r.ok) { alert('Отчёт не найден'); return; }
  paint(await r.json());
  loadContract(id);
  document.getElementById('toLawyer').href = '/lawyer.html?aid=' + id;
  fetch('/api/lawyer_analysis_left?analysis_id=' + id, {headers: H})
    .then(rr => rr.ok ? rr.json() : null)
    .then(d => { if (d && d.limit > 0) { const el = document.getElementById('lawyerLeftAnalysis'); el.style.display = 'inline-flex'; el.textContent = 'Осталось вопросов по договору: ' + d.left + ' из ' + d.limit; } })
    .catch(() => {});
  history.replaceState(null, '', '/report.html?id=' + id);
}

async function loadHistory(){
  const r = await fetch('/api/analyses', {headers: H});
  const list = await r.json();
  document.getElementById('historyList').innerHTML = list.map(a =>
    '<button data-id="' + a.id + '" class="hist">' +
    '<div class="font-semibold text-sm">' + mcaEsc(a.title || a.type || 'Договор') + ' · #' + a.id + '</div>' +
    '<div class="text-xs text-white/50 mt-1">' + (a.created_at || '') + '</div></button>').join('')
    || '<p class="text-white/50 text-sm">Пока пусто.</p>';
  document.querySelectorAll('#historyList button').forEach(b => b.onclick = () => loadReport(b.dataset.id));
  if (!aid && list.length) aid = list[0].id;
  if (aid) loadReport(aid);
}

async function init(){
  if (!isAuth) {
    document.getElementById('sideHist').style.display = 'none';
    document.getElementById('dlRow').style.display = 'none';
    document.getElementById('actionsRow').style.display = 'none';
    ['tabToolsBtn','tabSearchBtn','tabFeedbackBtn','tabContractBtn'].forEach(id => {
      const el = document.getElementById(id); if (el) el.remove();
    });
    const r = await fetch('/api/public/analyses/' + aid);
    if (!r.ok) {
      document.getElementById('scoreBadge').innerHTML =
        '<div class="glass p-6 text-sm">🔒 Этот отчёт приватный или ссылка недействительна. <a class="text-amber-400 underline" href="/auth.html#login">Войди</a>, чтобы смотреть свои отчёты.</div>';
      return;
    }
    document.getElementById('pubNote').classList.remove('hidden');
    paint(await r.json());
    return;
  }
  document.getElementById('shareBtn').onclick = async () => {
    const r = await fetch('/api/analyses/' + aid + '/share', {method: 'POST', headers: H});
    const d = await r.json();
    if (r.ok) {
      try { await navigator.clipboard.writeText(d.url); } catch(e) {}
      document.getElementById('shareMsg').textContent = '✅ Ссылка скопирована: ' + d.url;
    }
  };
  document.getElementById('renameBtn').onclick = async () => {
    const t = await mcaPrompt('Новое название отчёта', 'Например: Аренда цеха — редакция контрагента');
    if (!t) return;
    await fetch('/api/analyses/' + aid + '/rename', {method: 'POST',
      headers: {'Content-Type': 'application/json', ...H}, body: JSON.stringify({title: t})});
    loadHistory();
  };
  document.getElementById('emailBtn').onclick = async () => {
    const b = document.getElementById('emailBtn');
    b.textContent = '⏳ Отправляю…';
    const r = await fetch('/api/analyses/' + aid + '/email', {method: 'POST', headers: H});
    b.textContent = r.ok ? '✅ Отправлено на почту' : '❌ Ошибка отправки';
  };
  loadHistory();
}

const TOOLS = [
  ['redline_v2','📄 Redline (протокол изменений)'], ['letter','✉️ Письмо контрагенту'],
  ['negotiation','🎙 Скрипт переговоров'], ['benchmark','📊 Рыночный эталон'],
  ['passport','🪪 Паспорт договора'], ['translate','🌐 Перевод RU↔EN'], ['precedent','⚖️ Прецедент-радар']
];
document.getElementById('toolButtons').innerHTML = TOOLS.map(t =>
  '<button data-tool="' + t[0] + '" class="tab-btn text-sm">' + t[1] + '</button>').join('');
document.querySelectorAll('#toolButtons button').forEach(b => b.onclick = async () => {
  const out = document.getElementById('toolOut');
  out.textContent = '⏳ Генерирую… (может занять до минуты)';
  try {
    const r = await fetch('/api/tools/' + b.dataset.tool, {
      method: 'POST', headers: {'Content-Type': 'application/json', ...H},
      body: JSON.stringify({analysis_id: +aid, scenario: ''})
    });
    const d = await r.json();
    out.innerHTML = r.ok ? mcaMd(d.text) : ('❌ ' + mcaEsc(d.detail || 'Ошибка'));
  } catch(e) { out.textContent = '❌ Сеть недоступна'; }
});

document.getElementById('lawyerAskBtn').onclick = async () => {
  const q = document.getElementById('lawyerQ').value.trim();
  if (!q) { alert('Введи вопрос для юриста'); return; }
  const outBox = document.getElementById('lawyerOut');
  outBox.classList.remove('hidden');
  outBox.innerHTML = '<span class="text-white/50">⏳ Юрист изучает отчёт и договор…</span>';
  try {
    const r = await fetch('/api/lawyer_analysis', {method: 'POST',
      headers: {'Content-Type': 'application/json', ...H},
      body: JSON.stringify({analysis_id: +aid, question: q})});
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      outBox.innerHTML = '<span class="text-red-400">❌ ' + mcaEsc(d.detail || 'Ошибка') + '</span>';
      return;
    }
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '', out = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, i); buf = buf.slice(i + 2);
        try {
          const obj = JSON.parse(raw.replace(/^data: /, ''));
          if (obj.chunk) { out += obj.chunk; outBox.innerHTML = mcaMd(out); }
          if (obj.done && obj.left !== undefined) {
            const el = document.getElementById('lawyerLeftAnalysis');
            el.style.display = 'inline-flex';
            el.textContent = 'Осталось вопросов по договору: ' + obj.left;
          }
        } catch(e) {}
      }
    }
  } catch(e) { outBox.innerHTML = '<span class="text-red-400">❌ Сеть недоступна</span>'; }
};

document.getElementById('clauseBtn').onclick = () => {
  const q = document.getElementById('clauseQ').value.trim();
  if (!q) return;
  const pick = t => (t || '').split('\n').filter(l => l.includes(q)).slice(0, 4);
  const ch = pick(contractText), rh = pick(reportRaw);
  document.getElementById('clauseOut').innerHTML =
    (ch.length ? '<div><b>В договоре:</b>' + ch.map(l => '<div class="glass p-3 mt-2">' + mcaEsc(l) + '</div>').join('') + '</div>' : '') +
    (rh.length ? '<div class="mt-4"><b>В отчёте:</b>' + rh.map(l => '<div class="glass p-3 mt-2">' + mcaEsc(l) + '</div>').join('') + '</div>' : '') +
    (!ch.length && !rh.length ? '<p class="text-white/50">Не найдено.</p>' : '');
};

document.getElementById('fbBtn').onclick = async () => {
  const r = await fetch('/api/feedback_v2', {
    method: 'POST', headers: {'Content-Type': 'application/json', ...H},
    body: JSON.stringify({analysis_id: +aid, rating: +document.getElementById('fbRating').value,
                          comment: document.getElementById('fbComment').value})
  });
  document.getElementById('fbMsg').textContent = r.ok ? '✅ Отзыв сохранён, спасибо!' : '❌ Ошибка';
};

document.getElementById('dlPdf').onclick = () => mcaDownload('/api/analyses/' + aid + '/pdf', 'report_' + aid + '.pdf');
document.getElementById('dlDocx').onclick = () => mcaDownload('/api/analyses/' + aid + '/docx', 'report_' + aid + '.docx');
document.getElementById('dlProto').onclick = () => mcaDownload('/api/analyses/' + aid + '/protocol', 'protocol_' + aid + '.docx');
document.getElementById('dlAudio').onclick = async () => {
  const box = document.getElementById('audioBox');
  box.classList.remove('hidden');
  box.innerHTML = '<p class="text-sm text-white/60">⏳ Генерирую аудио… (первый раз до минуты)</p>';
  const r = await fetch('/api/analyses/' + aid + '/audio', {headers: H});
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    box.innerHTML = '<p class="text-sm text-red-400">❌ ' + mcaEsc(d.detail || 'Недоступно') + '</p>';
    return;
  }
  const b = await r.blob();
  box.innerHTML = '<audio controls src="' + URL.createObjectURL(b) + '" class="w-full"></audio>';
};

mcaNav(); mcaFooter(); init();
</script>
</body>
</html>
